spring:
  data:
    redis:
      host: redis
      port: 6379
  cache:
    type: redis

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:kafka:29092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      acks: all
      retries: 3
    properties:
      allow.auto.create.topics: true
    consumer:
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer

        spring.json.use.type.headers: false
        spring.json.value.default.type: shared.dto.AiMessageRequest
        spring.json.trusted.packages: shared.dto
      group-id: bank_response_group_v3
      auto-offset-reset: earliest
      enable-auto-commit: true
      auto-commit-interval: 1000

  mail:
    username: ${EMAIL_USERNAME}
    password: ${EMAIL_PASSWORD}
    host: smtp.gmail.com
    port: 587
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
            required: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
          ssl:
            protocols: TLSv1.2

  config:
    import: optional:file:.env[.properties]
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:default}
  application:
    name: Bank_System

  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

    hikari:
      maximum-pool-size: 15
      minimum-idle: 10
      idle-timeout: 20000
      connection-timeout: 3000
      max-lifetime: 1800000

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true

app:
  kafka:
    topic:
      messages: ai_messages
      answers: bank_ai_answers
  mail:
    # Transactional email is sent via the Brevo HTTP API (port 443), because outbound SMTP
    # is often blocked by ISPs. Create a free account at brevo.com, verify a sender address,
    # generate an API key, then set these env vars in .env.
    brevo:
      api-key: ${BREVO_API_KEY:}
      sender-email: ${MAIL_SENDER_EMAIL:}
      sender-name: ${MAIL_SENDER_NAME:Aurora Bank}


jwt:
  secret: ${JWT_SECRET}
  expiration: ${JWT_EXPIRATION}

server:
  port: 8080